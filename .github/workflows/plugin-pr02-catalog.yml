name: PLUGIN PR02 API Catalog
on:
  pull_request:
    paths:
      - "Implementation/LinkCore/LinkCore.js"
      - "Implementation/property/APIDescriptorPolicy.js"
      - "Implementation/tests/api-descriptor.test.js"
      - "Implementation/e2e/plugin-pr02-descriptor.spec.js"
      - "PR/PR10/PLUGIN PR/**"
      - ".github/workflows/plugin-pr02-catalog.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node --test Implementation/tests/api-descriptor.test.js
      - run: npm run check
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: >
          npx playwright test
          Implementation/e2e/plugin-pr02-descriptor.spec.js
          --config Implementation/e2e/playwright.config.js
