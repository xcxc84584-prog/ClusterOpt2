name: Local Agent PowerShell Parse
on:
  push:
    branches: [main, "pr9/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          ./Implementation/tests/native-installer-parser.ps1
          ./Implementation/tests/native-installer-port.test.ps1
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with PowerShell 7
        shell: pwsh
        run: ./Implementation/tests/native-installer-parser.ps1

  native-conpty-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install and rebuild approved node-pty
        shell: pwsh
        working-directory: Implementation/local-agent
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm rebuild node-pty --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real native ConPTY probe as a file
        shell: pwsh
        working-directory: Implementation/local-agent
        run: |
          node probe-native.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
