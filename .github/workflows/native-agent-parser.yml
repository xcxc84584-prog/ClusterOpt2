name: Local Agent PowerShell Parse
on:
  push:
    branches: [main, "pr9/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with Windows PowerShell 5.1
        shell: powershell
        run: ./Implementation/tests/native-installer-parser.ps1
  powershell-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with PowerShell 7
        shell: pwsh
        run: ./Implementation/tests/native-installer-parser.ps1
