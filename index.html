<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClusterOpt2 · PR1</title>
  <link rel="stylesheet" href="./Implementation/main/style.css">
  <script type="module" src="./Implementation/main/main.js"></script>
</head>
<body>
  <div class="shell">
    <header class="toolbar">
      <div class="brand"><span class="diamond">◇</span><strong>Cluster</strong><small>Opt2 · PR1</small></div>
      <div class="actions">
        <button id="newFile" title="建立新檔">新增</button>
        <button id="openFile" title="開啟檔案">開啟</button>
        <button id="saveFile" title="儲存檔案">儲存</button>
        <button id="saveAsFile" title="另存新檔">另存</button>
        <button id="closeFile" title="關閉目前分頁">關閉</button>
      </div>
    </header>
    <nav id="tabs" class="tabs" aria-label="文件分頁"></nav>
    <main class="editor-pane">
      <div id="emptyState" class="empty-state">選擇「新增」或「開啟」開始編輯</div>
      <div id="editorSurface" class="editor-surface" hidden>
        <pre id="lineNumbers" class="line-numbers" aria-hidden="true">1</pre>
        <textarea id="editor" spellcheck="false" aria-label="文字編輯器" wrap="off"></textarea>
      </div>
    </main>
    <footer class="statusbar">
      <span id="statusLamp" class="lamp green"></span>
      <span id="statusText" aria-live="polite">就緒</span>
      <span id="lineInfo">Ln 1, Col 1</span>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressText"></span>
    </footer>
  </div>
</body>
</html>
