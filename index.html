<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClusterOpt2</title>
  <!-- Reuse the ClusterOpt UI; PR1 changes behavior, not visual design. -->
  <link rel="stylesheet" href="./Implementation/main/clusteropt-legacy.css">
  <link rel="stylesheet" href="./Implementation/main/style.css">
  <script type="module" src="./Implementation/main/main.js"></script>
</head>
<body>
  <div id="app" class="shell">
    <header class="toolbar">
      <div class="brand">
        <span class="diamond">◇</span>
        <strong>Cluster</strong>
        <small id="versionLabel"></small>
      </div>
      <div class="menu-wrap">
        <button id="menuBtn" type="button" aria-expanded="false"
          aria-controls="menu">檔案⌄</button>
        <nav id="menu" hidden aria-label="檔案選單">
          <button id="newFile" type="button">建立新檔</button>
          <button id="openFile" type="button">開啟檔案</button>
          <div class="menu-divider"></div>
          <button id="saveFile" type="button">儲存</button>
          <button id="saveAsFile" type="button">另存新檔</button>
          <div class="menu-divider"></div>
          <button id="closeFile" type="button">關閉分頁</button>
          <div class="menu-divider"></div>
          <button id="toolBtn" type="button" aria-expanded="false"
            aria-controls="toolOptions">工具 ›</button>
          <div id="toolOptions" hidden role="group" aria-label="工具">
            <div class="file-tool-heading">FILE TOOL <span>WORKSPACE</span></div>
            <button id="closeAll" type="button">關閉所有視窗</button>
            <button id="languageBtn" type="button" aria-expanded="false"
              aria-controls="languageOptions">語言 ›</button>
            <div id="languageOptions" hidden>
              <button type="button" data-locale="zh-Hant">
                繁體中文 <span class="locale-check"></span>
              </button>
              <button type="button" data-locale="en">
                English <span class="locale-check"></span>
              </button>
            </div>
            <button id="paletteBtn" type="button">介面調色盤 ›</button>
          </div>
        </nav>
      </div>
    </header>
    <div id="clusterWorkspaceShell">
      <div id="clusterEditorColumn">
        <div id="tabs" class="tabs" aria-label="文件分頁"></div>
        <main id="workspace" class="editor-pane">
          <div id="empty" class="empty-state">
            <div class="bigdiamond">◇</div>
            <h1>Cluster</h1>
            <p id="emptyHint">選擇「檔案」建立或開啟文件</p>
          </div>
          <div id="editorPane" class="editor-surface" hidden>
            <pre id="gutter" class="line-numbers"
              aria-hidden="true">1</pre>
            <textarea id="editor" spellcheck="false"
              aria-label="文字編輯器" wrap="off"></textarea>
          </div>
        </main>
      </div>
    </div>
    <footer class="statusbar">
      <div class="meter progress-track" aria-hidden="true">
        <div id="meterFill" class="progress-fill"></div>
      </div>
      <span id="meterPercent"></span>
      <span id="statusLamp" class="lamp green"></span>
      <span id="status" aria-live="polite">就緒</span>
      <span class="grow"></span>
      <span id="position">Ln 1, Col 1</span>
      <span>UTF-8</span>
      <span id="fileType">純文字</span>
    </footer>
  </div>
    <!-- Reused from ClusterOpt's original palette dialog markup. -->
    <dialog id="paletteDialog" aria-labelledby="paletteTitle">
      <div class="palette-modal-header">
        <div>
          <div class="palette-eyebrow">CLUSTER / APPEARANCE</div>
          <h2 id="paletteTitle">介面調色盤</h2>
        </div>
        <button id="paletteClose" class="palette-close" type="button"
          aria-label="關閉">×</button>
      </div>
      <div class="palette-modal-body">
        <div class="palette-preview" aria-hidden="true">
          <div class="palette-preview-top">
            <span class="palette-preview-dot"></span>
            <span>CLUSTER</span>
            <span class="palette-preview-caption">UI PREVIEW</span>
          </div>
          <div class="palette-preview-content">
            <div class="palette-preview-sidebar"></div>
            <div class="palette-preview-editor">
              <div class="palette-preview-line"></div>
              <div class="palette-preview-line short"></div>
              <div class="palette-preview-line medium"></div>
            </div>
          </div>
        </div>
        <div class="palette-section-title">
          <label id="paletteLabel" for="palettePicker">介面色系 RGB</label>
          <span id="paletteHex">#000000</span>
        </div>
        <div class="palette-picker-row">
          <input id="palettePicker" type="color" value="#000000">
          <span id="paletteHint">選擇顏色以即時預覽整體介面</span>
        </div>
        <div class="palette-channels">
          <label>R <input data-rgb="0" type="number" min="0"
            max="255" step="1" aria-label="Red"></label>
          <label>G <input data-rgb="1" type="number" min="0"
            max="255" step="1" aria-label="Green"></label>
          <label>B <input data-rgb="2" type="number" min="0"
            max="255" step="1" aria-label="Blue"></label>
        </div>
        <div class="palette-section-title">
          <span id="palettePresetLabel">端點風格</span>
          <span id="paletteMode">DARK</span>
        </div>
        <div class="palette-presets">
          <button id="paletteDark" type="button">黑色端點</button>
          <button id="paletteLight" type="button">白色端點</button>
        </div>
      </div>
      <div class="palette-modal-footer">
        <span id="paletteFooterHint">設定會自動儲存</span>
        <button id="paletteDone" type="button">完成</button>
      </div>
    </dialog>
</body>
</html>
